<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Barberium | Juiz de Fora</title>
<meta name="description" content="Agende seu horário online, fale pelo WhatsApp e saiba como chegar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Georgia,serif' font-weight='700' text-anchor='middle' fill='%23d4af37'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:        #0f1115;
    --card:      #181b22;
    --card-hover:#21252f;
    --gold:      #d4af37;
    --text:      #f2f3f5;
    --muted:     #9aa0ab;
    --on-gold:   #0f1115;
    --line:      rgba(255,255,255,.07);
    --gold-soft: rgba(212,175,55,.14);
    --gold-glow: rgba(212,175,55,.35);
    --gold-edge: rgba(212,175,55,.45);
    --radius:    16px;
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  [hidden]{ display:none !important; }

  html{ -webkit-text-size-adjust:100%; }
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 30px 20px calc(32px + env(safe-area-inset-bottom));
    background-color: var(--bg);
    background-image: radial-gradient(520px 280px at 50% -60px, var(--gold-soft), transparent 70%);
    background-repeat:no-repeat;
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{ width:100%; max-width:440px; }

  /* ---------- BARRA DE ANÚNCIO / TOPO ---------- */
  .promo-bar{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
    color: var(--on-gold);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 12px;
    margin-bottom: 24px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
  }
  .promo-bar svg { width: 16px; height: 16px; flex: none; }

  /* ---------- CABEÇALHO ---------- */
  .profile{ text-align:center; margin-bottom:28px; }

  .logo{
    width:96px; height:96px;
    margin:0 auto 16px;
    border-radius:50%;
    background: var(--card);
    border:1px solid var(--gold-edge);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    box-shadow: 0 10px 30px -12px var(--gold-glow);
  }
  .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .logo-fallback{
    font-family: Georgia, serif;
    font-size:44px; font-weight:700;
    color: var(--gold);
    line-height:1;
  }

  h1{ font-size:24px; font-weight:700; letter-spacing:-.01em; }
  .tagline{ margin-top:4px; font-size:14px; color:var(--muted); }

  /* Status de Aberto / Fechado */
  .status-badge{
    margin-top: 12px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
  }
  .status-dot{
    width: 8px; height: 8px; border-radius: 50%;
  }
  .status-dot.open { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }
  .status-dot.closed { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }

  /* ---------- BOTÕES ---------- */
  .links{ display:flex; flex-direction:column; gap:12px; margin-bottom: 12px; }

  .btn{
    display:flex; align-items:center; gap:14px;
    min-height:60px;
    padding:0 16px;
    background: var(--card);
    color: var(--text);
    text-decoration:none;
    font-size:15.5px; font-weight:600;
    border:1px solid var(--line);
    border-radius: var(--radius);
    transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .btn-icon{
    flex:none; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:11px;
    background: var(--gold-soft);
    color: var(--gold);
  }
  .btn-icon svg{ width:20px; height:20px; }
  .btn-label{ flex:1; text-align:left; line-height:1.3; }
  .btn-arrow{ flex:none; width:18px; height:18px; color:var(--muted); opacity:.7; }

  .btn:active{ transform: scale(.98); }
  @media (hover:hover){
    .btn:hover{
      transform: translateY(-2px);
      border-color: var(--gold-edge);
      background-color: var(--card-hover);
    }
  }

  /* Botão principal (Agendar) */
  .btn-primary{
    min-height:66px;
    font-size:16.5px;
    background: var(--gold);
    color: var(--on-gold);
    border-color: transparent;
    box-shadow: 0 12px 28px -12px var(--gold-glow);
  }
  .btn-primary .btn-icon{ background: rgba(0,0,0,.14); color: var(--on-gold); }
  .btn-primary .btn-arrow{ color: var(--on-gold); opacity:.8; }
  @media (hover:hover){
    .btn-primary:hover{ background: #e0be41; border-color: transparent; }
  }

  /* ---------- MINI MAPA / ENDEREÇO ---------- */
  .map-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    display: block;
    transition: transform .15s ease, border-color .2s ease;
  }
  .map-preview {
    width: 100%;
    height: 110px;
    background-color: #21252f;
    position: relative;
    overflow: hidden;
  }
  .map-preview iframe {
    width: 100%;
    height: 100%;
    border: 0;
    pointer-events: none;
    filter: grayscale(40%) contrast(120%) invert(90%) hue-rotate(180deg);
    opacity: 0.85;
  }
  .map-info {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .map-content-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .map-icon {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 11px;
    background: var(--gold-soft);
    color: var(--gold);
    flex: none;
  }
  .map-icon svg { width: 20px; height: 20px; }
  .map-text .map-title { font-size: 14.5px; font-weight: 600; color: var(--text); }
  .map-text .map-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  @media (hover:hover){
    .map-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold-edge);
    }
  }

  /* ---------- RODAPÉ ---------- */
  footer{ margin-top:30px; text-align:center; font-size:12px; color:var(--muted); opacity:.75; }
</style>
</head>
<body>

<main class="wrap">

  <!-- BARRA DE ANÚNCIO (Campanha / Promoção) -->
  <div class="promo-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
    <span>Condições especiais no app de agendamento!</span>
  </div>

  <!-- CABEÇALHO -->
  <header class="profile">
    <div class="logo" id="logo">
      <span class="logo-fallback" id="logoFallback">B</span>
    </div>
    <h1>Barberium</h1>
    <p class="tagline">Tradição e Estilo · Juiz de Fora</p>
    
    <!-- Status Dinâmico (Aberto / Fechado) -->
    <div class="status-badge" id="statusBadge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Verificando horário...</span>
    </div>
  </header>

  <!-- BOTÕES DE AÇÃO -->
  <nav class="links">
    <!-- a) Agendar Horário -->
    <a class="btn btn-primary" href="https://cashbarber.com.br/barberium" target="_blank" rel="noopener noreferrer">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </span>
      <span class="btn-label">Agendar Horário Online</span>
      <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </a>

    <!-- b) WhatsApp -->
    <a class="btn" href="https://wa.me/5532991998079?text=Olá!%20Gostaria%20de%20tirar%20dúvidas%20sobre%20os%20horários." target="_blank" rel="noopener noreferrer">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      </span>
      <span class="btn-label">Atendimento via WhatsApp</span>
      <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </a>

    <!-- c) MINI MAPA / ENDEREÇO -->
    <a class="map-card" href="https://www.google.com/maps/search/?api=1&query=Avenida+Barão+do+Rio+Branco+1704+Centro+Juiz+de+Fora+MG" target="_blank" rel="noopener noreferrer">
      <div class="map-preview">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3705.355320573031!2d-43.3512!3d-21.7661!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x989ba119f3b5f7%3A0x82442cf38f5f6e86!2sAv.%20Bar%C3%A3o%20do%20Rio%20Branco%2C%201704%20-%20Centro%2C%20Juiz%20de%20Fora%20-%20MG!5e0!3m2!1spt-BR!2sbr!4v1650000000000!5m2!1spt-BR!2sbr" 
          allowfullscreen="" 
          loading="lazy">
        </iframe>
      </div>
      <div class="map-info">
        <div class="map-content-left">
          <div class="map-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="map-text">
            <div class="map-title">Nossa Localização</div>
            <div class="map-sub">Av. Barão do Rio Branco, 1704 · Centro</div>
          </div>
        </div>
        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </a>
  </nav>

  <footer>© <span id="ano"></span> Barberium · Todos os direitos reservados</footer>
</main>

<script>
  document.getElementById('ano').textContent = new Date().getFullYear();

  function atualizarStatusBarbearia() {
    const agora = new Date();
    const diaSemana = agora.getDay();
    const hora = agora.getHours();
    const minutos = agora.getMinutes();
    const horaDecimal = hora + minutos / 60;

    let aberto = false;
    if (diaSemana >= 1 && diaSemana <= 6) {
      if (horaDecimal >= 9 && horaDecimal < 20) {
        aberto = true;
      }
    }

    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');

    if (aberto) {
      dot.className = 'status-dot open';
      text.textContent = 'Aberto agora • Fecha às 20h';
    } else {
      dot.className = 'status-dot closed';
      text.textContent = 'Fechado no momento • Abre às 09h';
    }
  }

  atualizarStatusBarbearia();
</script>
</body>
</html>
